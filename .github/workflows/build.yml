name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install DUA JDK: 17 buat jalanin sdkmanager (dia sendiri butuh JDK17+
      # buat load class-nya), 11 buat Gradle build (AGP 7.0.3 / Gradle 7.0.2
      # gak jalan/cocok di JDK 17+). Yang terakhir di array jadi default JAVA_HOME,
      # yang lain tetap kesedia lewat env JAVA_HOME_<version>_X64.
      - name: Set up JDK 17 & JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            11

      # Pakai SDK preinstalled di runner (ANDROID_HOME sudah ke-set), tapi
      # sdkmanager di dalamnya butuh JDK 17 buat jalan -- override JAVA_HOME
      # cuma di step ini.
      - name: Accept licenses & install NDK/CMake/platform
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          echo "Pakai JAVA_HOME=$JAVA_HOME buat sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;22.1.7171670" \
            "cmake;3.10.2.4988404"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Balik ke JDK 11 (default JAVA_HOME dari setup-java di atas) buat build
      - name: Build debug APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/22.1.7171670
        run: |
          echo "Pakai JAVA_HOME=$JAVA_HOME buat gradle build"
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: powertunnel-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release-unsigned:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 & JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            11

      - name: Accept licenses & install NDK/CMake/platform
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;22.1.7171670" \
            "cmake;3.10.2.4988404"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Unsigned release build -- belum di-sign pakai keystore.
      # Kalau mau di-install di device, harus di-sign dulu (apksigner)
      # atau tambahin signingConfig + secrets keystore di repo settings.
      - name: Build release APK (unsigned)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/22.1.7171670
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: powertunnel-android-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
