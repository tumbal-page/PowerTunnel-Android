name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 7.0.3 + Gradle 7.0.2 cuma jalan di JDK 11 (JDK 17+ bikin gradle daemon crash)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # Runner ubuntu-latest sudah ada Android SDK preinstalled (ANDROID_HOME
      # sudah di-set). Sengaja TIDAK pakai android-actions/setup-android@v3 di
      # sini karena action itu memaksa download cmdline-tools versi terbaru
      # yang butuh JDK 17 buat jalanin sdkmanager-nya sendiri -- bentrok sama
      # JDK 11 yang dibutuhin proses build Gradle di step berikutnya.
      - name: Accept licenses & install NDK/CMake/platform (pakai SDK preinstalled)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;22.1.7171670" \
            "cmake;3.10.2.4988404"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/22.1.7171670

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: powertunnel-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release-unsigned:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Accept licenses & install NDK/CMake/platform (pakai SDK preinstalled)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;22.1.7171670" \
            "cmake;3.10.2.4988404"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Unsigned release build -- belum di-sign pakai keystore.
      # Kalau mau di-install di device, harus di-sign dulu (apksigner)
      # atau tambahin signingConfig + secrets keystore di repo settings.
      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/22.1.7171670

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: powertunnel-android-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
