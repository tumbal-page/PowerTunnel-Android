name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 7.0.3 + Gradle 7.0.2 butuh JDK 11 (bukan 17/21)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Native build (CMake) di app/build.gradle butuh NDK 22.1.7171670
      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;22.1.7171670" "cmake;3.10.2.4988404" "platforms;android-30" "build-tools;30.0.3"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: powertunnel-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release-unsigned:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;22.1.7171670" "cmake;3.10.2.4988404" "platforms;android-30" "build-tools;30.0.3"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Unsigned release build -- belum di-sign pakai keystore.
      # Kalau mau di-install di device, harus di-sign dulu (apksigner)
      # atau tambahin signingConfig + secrets keystore di repo settings.
      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: powertunnel-android-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
